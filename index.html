<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1abc9c">
    <title>掃描槍作業系統 / Hệ thống quét mã vạch</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #2c3e50; color: #fff; padding: 40px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .card { background: #34495e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 500px; text-align: center; }
        input { position: absolute; opacity: 0; pointer-events: none; }
        .status-box { font-size: 28px; color: #1abc9c; margin: 20px 0; padding: 20px; border: 3px solid #1abc9c; border-radius: 10px; background: #2c3e50; }
        .last-scanned { font-weight: bold; font-size: 1.4em; min-height: 2em; margin: 10px 0; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; }
        .btn-save { background: #27ae60; color: white; }
        .btn-reset { background: #e74c3c; color: white; }
        #log-list { margin-top: 30px; width: 100%; text-align: left; background: #2c3e50; padding: 15px; border-radius: 8px; }
        .item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #3e5871; font-size: 18px; }
        .tip { color: #95a5a6; font-size: 14px; margin-top: 10px; }
        .queue-badge { display: none; margin-top: 12px; padding: 10px 18px; background: #e67e22; border-radius: 8px; font-size: 15px; font-weight: bold; }
    </style>
</head>
<body onclick="initAudio()">
    <div class="card">
        <h1>📦 掃描槍作業系統 / Hệ thống quét mã vạch</h1>
        <p class="tip">倉庫出貨掃描 / Quét xuất kho</p>

        <input type="text" id="barcodeInput" autofocus>

        <div class="status-box">
            累計數量 / Tổng số lượng：<span id="total-count">0</span> 件
        </div>

        <div id="last-code" class="last-scanned">點擊畫面後開始 / Nhấn màn hình để bắt đầu</div>

        <div id="log-list">
            <div id="logs"></div>
        </div>

        <div class="btn-group">
            <button class="btn-save" onclick="exportAll()">💾 匯出 + 同步雲端 / Xuất & đồng bộ</button>
            <button class="btn-reset" onclick="clearAll()">🗑️ 清空 / Xóa tất cả</button>
        </div>
        <div id="queue-badge" class="queue-badge">
            📴 <span id="queue-count">0</span> 筆待補傳 / bản chờ đồng bộ
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzPORG-vm_mbAqGa7EY-rqIBTDwZ0xwp1BDYDw8RkHhrlizw2sSVwr35i5Gb86xQ-05/exec'; // 部署後填入

        const input = document.getElementById('barcodeInput');
        const scanLog = [];
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                document.getElementById('last-code').innerText = '系統已就緒，請掃描 / Sẵn sàng, vui lòng quét';
            }
            input.focus();
        }

        function playTone(freq, type, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        setInterval(() => input.focus(), 1000);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const code = input.value.trim();
                if (code) processCode(code);
                input.value = '';
            }
        });

        function playAlarm() {
            if (!audioCtx) return;
            [400, 300, 400, 300].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const t = audioCtx.currentTime + i * 0.18;
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.15);
            });
        }

        function processCode(code) {
            if (!/^C\d{8}$/.test(code)) {
                playAlarm();
                document.getElementById('last-code').innerText = '❌ 格式錯誤 / Sai định dạng：' + code;
                document.getElementById('last-code').style.color = '#e74c3c';
                return;
            }
            const isDuplicate = scanLog.some(item => item.code === code);
            if (isDuplicate) {
                playAlarm();
                document.getElementById('last-code').innerText = '⚠️ 重複 / Trùng lặp：' + code;
                document.getElementById('last-code').style.color = '#e74c3c';
                return;
            }
            playTone(880, 'sine', 0.15);
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
            const dateStr = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0');
            scanLog.unshift({ code, time: timeStr, date: dateStr });
            document.getElementById('last-code').innerText = '✅ 已讀取 / Đã quét：' + code;
            document.getElementById('last-code').style.color = '#2ecc71';
            updateUI();
        }

        function updateUI() {
            document.getElementById('total-count').innerText = scanLog.length;
            document.getElementById('logs').innerHTML = scanLog.slice(0, 5).map(item => `
                <div class="item">
                    <span>${item.code}</span>
                    <span style="color:#bdc3c7;font-size:14px">${item.time}</span>
                </div>
            `).join('');
        }

        // ── 離線佇列 ──
        const QUEUE_KEY = 'scanner_submit_queue';
        function getQueue() {
            try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }
            catch(e) { return []; }
        }
        function saveQueue(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }

        function updateBadge() {
            var n = getQueue().length;
            document.getElementById('queue-count').textContent = n;
            document.getElementById('queue-badge').style.display = n > 0 ? 'block' : 'none';
        }

        function enqueue(data) {
            var q = getQueue();
            q.push({ ts: new Date().toISOString(), data: data });
            saveQueue(q);
            updateBadge();
        }

        function flushQueue() {
            if (!navigator.onLine) { updateBadge(); return; }
            var q = getQueue();
            if (!q.length) { updateBadge(); return; }
            var item = q.shift();
            saveQueue(q);
            fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(item.data) })
                .then(function() { updateBadge(); flushQueue(); })
                .catch(function() {
                    var q2 = getQueue(); q2.unshift(item); saveQueue(q2);
                    updateBadge();
                });
        }

        window.addEventListener('online', flushQueue);
        // ── 佇列結束 ──

        function exportAll() {
            if (scanLog.length === 0) return;
            const statusEl = document.getElementById('last-code');
            const now = new Date();
            const dateStr = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0');
            const batchStr = dateStr + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0');

            let content = '﻿序號,日期,時間,條碼內容\n';
            [...scanLog].reverse().forEach((item, index) => {
                content += `${index + 1},${item.date},${item.time},"${item.code}"\n`;
            });
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = dateStr + '_掃描結果.csv';
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            const payload = [...scanLog].reverse().map((item, index) => ({
                seq: index + 1,
                date: item.date,
                time: item.time,
                code: item.code,
                batch: batchStr
            }));
            enqueue(payload);
            flushQueue();

            if (navigator.onLine) {
                statusEl.innerText = '☁️ 同步中... / Đang đồng bộ...';
                statusEl.style.color = '#1abc9c';
            } else {
                statusEl.innerText = '📴 已暫存，上線後自動補傳 / Đã lưu, sẽ đồng bộ khi có mạng';
                statusEl.style.color = '#e67e22';
            }
        }

        window.onload = function() { if (navigator.onLine) flushQueue(); updateBadge(); };

        function clearAll() {
            if (confirm('確定要清空所有紀錄嗎？\nBạn có chắc muốn xóa tất cả?')) {
                scanLog.length = 0;
                document.getElementById('last-code').innerText = '等待掃描... / Đang chờ quét...';
                document.getElementById('last-code').style.color = '#fff';
                updateUI();
            }
        }
    </script>
</body>
</html>
